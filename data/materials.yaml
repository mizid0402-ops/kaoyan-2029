  review_status: verified
  notes: '第五十一条：考试期间不得向媒体提供试题、答案及评分参考；考试结束后，不得向 任何媒体提供或者发表考试试题的评分细则。→ 评分细则考后亦禁止发表，单独列为 禁止项；这是「已知且禁止」，不是「权利不明」（故
    rights.is_clear() 为真， 但 permits_evidence() 为假）。

    同时更正本项目的既有假设：禁止的是「考试期间发布」，不是永久禁止。 官方大纲附录内即含真题与参考答案，因此合规边界是「系统不复制」， 而非「官方没有」。'
  history:
  - at: '2026-09-12T00:00:00+08:00'
    action: registered
    actor: dsh-reconnaissance
    detail: 法规约束作为禁止项登记，供下游 rights gate 引用
