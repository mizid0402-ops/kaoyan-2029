coders:
  - sol
  - luna
  - claude
confidence_weights:
  high: 1.0
  medium: 0.6
  low: 0.3
topic_rollup:
  cs408: chapter
  math1: none
  eng1: none
meta:
  policy: confidence-weighted multi-coder attribution; each question normalised to 1.0
  caveat: >-
    eng1/math1 trees are coarse (no item tier for eng1 sections), so they carry less
    discrimination than cs408; agreement there is cheaper to obtain
batches:
