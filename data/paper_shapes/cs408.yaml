      Marks DISPUTED, therefore deliberately left unverified. Question count is 47, not
      48: three independent 2026 sources state the essay range is 41-47 -- iqihang_2026_408.pdf
      prints '综合应用题:41~47 小题，共70 分。', and the kaoyan.cn static PDF's page 17 prints
      '（第 41~47 小题，共 70 分）'; the quiz page states '本题满分' exactly 7 times. An earlier
      revision of this record said 48, which produced a source-less index row for
      a Q48 that does not exist. On the marks themselves: the quiz page headlines
      (13/10/10/15/7/8/9 = 72) exceed the paper's own 150 total, while the PDFs' read
      values (12/10/10/15/7/8/9 = 71) miss it by one. The reviewed judgement in
      review/2026年408综合题分值-最终判定.md is 13/10/10/13/7/8/9 = 70: Q42, Q43, Q45,
      Q46 and Q47 are measured from available reconstructions (Q47 headline only),
      while Q41 and Q44 are inferences. Because the judgement mixes measurements
      with inferences rather than verified original-paper marks, the seven marks
      remain unverified in the registered paper shape.
